      - name: fe-sky-sw-l-02
        interfaces:

          # --- vPC peer link --------------------------------------------------
          # - name: port-channel500
          #   mode: vpc_peer_link
          #   mtu: 9216
          #   description: "vPC peer-link to fe-sky-sw-l-01"
          #   members:
          #     - Ethernet1/49
