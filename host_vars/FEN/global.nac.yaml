---
vxlan:
  fabric:
    name: FEN
    type: VXLAN_EVPN
  global:
    ibgp:
      bgp_asn: "65101"
      route_reflectors: 2
      anycast_gateway_mac: 12:34:56:78:90:00
      dns_servers:
        - ip_address: 192.0.2.100     # PLACEHOLDER — replace with your DNS server
          vrf: management
      ntp_servers:
        - ip_address: 192.0.2.1       # PLACEHOLDER — replace with your NTP server
          vrf: management
