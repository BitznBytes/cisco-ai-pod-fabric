---

name: Feature Request
description: Request a feature for the VXLAN as Code
title: Feature Request Title
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for creating a feature request issue to help us improve the VXLAN as Code. 
        Please fill out the sections below to help us understand and reproduce the issue you are facing.

  - type: textarea
    id: new-feature
    attributes:
      label: "New feature description:"
      description: Please provide input on the new feature required
      placeholder: New feature description
      render: shell
    validations:
      required: false

  - type: dropdown
    id: data-model
    attributes:
      label: Which section of the data model is the new feature related?
      multiple: false
      options:
        - vxlan.fabric
        - vxlan.global
        - vxlan.topology
        - vxlan.underlay
        - vxlan.overlay
        - vxlan.overlay_extensions
        - vxlan.policy
        - vxlan.multisite
        - defaults.vxlan
        - other
    validations:
      required: true

  - type: textarea
    id: new-feature-data-model
    attributes:
      label: Would this be a new feature requiring a new addition to the data model?
      description: Please provide input on the new the aspects to the data model if required
      placeholder: New data model aspects and description if required
      render: shell
    validations:
      required: false

  - type: textarea
    id: new-or-affected-documentation
    attributes:
      label: New or Affected Documentation for New Feature
      description: Please list the new or affected documentation sections for the new feature
      placeholder: Documentation section or new documentation that needs attention for the new feature
      render: shell
    validations:
      required: false

  - type: textarea
    id: ndfc-version
    attributes:
      label: Cisco NDFC Version
      description: Please provide your Cisco NDFC version being used
      render: shell
    validations:
      required: false

  - type: textarea
    id: nxos-version
    attributes:
      label: Cisco NX-OS Version
      description: Please provide your Cisco NX-OS version being used
      render: shell
    validations:
      required: false

  - type: input
    id: customer-name
    attributes:
      label: Associated Customer
      description: Provide customer name if applicable.
      placeholder: Customer name
    validations:
      required: false

  - type: dropdown
    id: services-as-code
    attributes:
      label: Is this a customer of Services as Code (LCS)?
      description: Is the issue opened for a customer with paid Services as Code support?
      options:
        - "No"
        - "Yes"
      default: 0
    validations:
      required: true

  - type: input
    id: customer-pid
    attributes:
      label: PID/DID
      description: Provide Project ID or deal ID to prioritize the issue.
      placeholder: Project ID or deal ID
    validations:
      required: false
