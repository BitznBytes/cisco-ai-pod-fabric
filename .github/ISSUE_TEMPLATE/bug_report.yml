name: Bug Report
description: Report a bug impacting VXLAN as Code
title: Bug Report Title
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for creating a bug issue to help us improve the VXLAN as Code. 
        Please fill out the sections below to help us understand and reproduce the issue you are facing.

  - type: textarea
    id: ndfc-version
    attributes:
      label: Cisco NDFC Version
      description: Please provide your Cisco NDFC version used when encountering this issue
      render: shell
    validations:
      required: true

  - type: textarea
    id: nxos-version
    attributes:
      label: Cisco NX-OS Version
      description: Please provide your Cisco NX-OS version used when encountering this issue
      render: shell
    validations:
      required: false

  - type: dropdown
    id: data-model
    attributes:
      label: Which section of the data model is this issue related to?
      multiple: false
      options:
        - vxlan.fabric
        - vxlan.global
        - vxlan.topology
        - vxlan.underlay
        - vxlan.overlay
        - vxlan.overlay_extensions
        - vxlan.policy
        - vxlan.multisite
        - defaults.vxlan
        - other
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Please provide the expected behavior
      placeholder: Expected behavior
      render: shell
    validations:
      required: false

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: Please provide the actual behavior
      placeholder: Actual behavior
      render: shell
    validations:
      required: false

  - type: textarea
    id: step-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Please provide the steps to reproduce the issue
      placeholder: List of steps to reproduce the issue
      render: shell
    validations:
      required: true

  - type: textarea
    id: debug-output
    attributes:
      label: Relevant Debug Output
      description: Please copy and paste any relevant log or debug output. This will be automatically formatted into code
      placeholder: Relevant log or debug output
      render: shell
    validations:
      required: false

  - type: input
    id: customer-name
    attributes:
      label: Associated Customer
      description: Provide customer name if applicable.
      placeholder: Customer name
    validations:
      required: false

  - type: dropdown
    id: services-as-code
    attributes:
      label: Is this a customer of Services as Code (LCS)?
      description: Is the issue opened for a customer with paid Services as Code support?
      options:
        - "No"
        - "Yes"
      default: 0
    validations:
      required: true

  - type: input
    id: customer-pid
    attributes:
      label: PID/DID
      description: Provide Project ID or deal ID to prioritize the issue.
      placeholder: Project ID or deal ID
    validations:
      required: false
